[project]
name = "editographer-worker"
version = "0.0.1"
description = "Editographer AI worker: analysis, planning and rendering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<0.163",
    "httpx>=0.28,<0.29",
    "nvidia-ml-py>=13.615,<14",
    "pydantic-settings>=2.16,<3",
    "structlog>=26.1,<27",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "import-linter>=2.15,<3",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU"]
addopts = "--strict-markers --cov=app/domain --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "BLE", "T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers point inward"
type = "layers"
layers = ["app.main", "app.api | app.adapters", "app.application", "app.ports", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain stays free of frameworks and I/O"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "httpx", "pynvml", "torch", "cv2", "av", "structlog"]

[[tool.importlinter.contracts]]
name = "Application uses ports, not libraries"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["fastapi", "httpx", "pynvml", "torch", "cv2", "av"]
