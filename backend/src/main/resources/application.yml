spring:
  application:
    name: editographer
  config:
    import: optional:file:./config/local.env[.properties]
  datasource:
    url: jdbc:h2:file:./${DATA_DIR:data}/editographer
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  media-dir: ${MEDIA_DIR:media}
  worker-url: http://${WORKER_HOST:127.0.0.1}:${WORKER_PORT:8090}
  worker-token: ${WORKER_TOKEN:}
  dispatch-interval-ms: 2000

server:
  address: 127.0.0.1
  port: ${BACKEND_PORT:8080}

logging:
  file:
    name: ${LOGS_DIR:logs}/backend.log
  structured:
    format:
      file: com.editographer.common.logging.JsonLogFormatter
  logback:
    rollingpolicy:
      max-history: 14
